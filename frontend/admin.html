<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Consola de administración · TechSphere</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
            </svg>
          </div>
          <div>
            <div class="brand-name">Conocimiento clínico</div>
            <div class="brand-sub">Consola de administración</div>
          </div>
        </div>
        <div class="row">
          <a class="btn btn-ghost" href="/call">Ir a la llamada</a>
          <span class="badge badge-success badge-live">
            <span class="badge-dot"></span> Índice activo
          </span>
        </div>
      </header>

      <div class="grid">
        <!-- Estado del índice -->
        <section class="card col-12">
          <div class="card-header">
            <div>
              <div class="card-eyebrow">Actualización en caliente</div>
              <h2 class="card-title">Estado del índice</h2>
            </div>
            <button class="btn btn-secondary btn-sm" type="button" id="reloadButton">Recargar</button>
          </div>
          <div class="card-body">
            <div id="statusGrid" class="metric-grid"></div>
            <div id="statusBox" class="notice notice-accent">Cargando estado del índice…</div>
          </div>
        </section>

        <!-- Subida -->
        <section class="card col-4">
          <div class="card-header">
            <h2 class="card-title">Subir documento</h2>
          </div>
          <div class="card-body">
            <form id="uploadForm" class="stack">
              <div>
                <span class="label">Archivo</span>
                <label class="file-drop" for="fileInput">
                  <svg class="file-drop-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="17 8 12 3 7 8" />
                    <line x1="12" y1="3" x2="12" y2="15" />
                  </svg>
                  <span class="file-drop-text">
                    <span class="file-drop-name" id="fileName">Elegir archivo</span>
                    <span class="file-drop-hint">PDF o TXT · los escaneados se rechazan (sin OCR)</span>
                  </span>
                  <input id="fileInput" name="file" type="file" accept=".pdf,.txt" />
                </label>
              </div>
              <button class="btn btn-primary btn-block" type="submit">Procesar y guardar</button>
            </form>
            <div id="uploadMessage" class="notice hidden"></div>
          </div>
        </section>

        <!-- Lista -->
        <section class="card col-8">
          <div class="card-header">
            <div>
              <h2 class="card-title">Documentos administrados</h2>
              <p class="hint">Cada registro muestra su estado visible para la compuerta G5.</p>
            </div>
            <button class="btn btn-secondary btn-sm" type="button" id="refreshButton">Actualizar lista</button>
          </div>
          <div class="card-body">
            <div id="documentsList" class="doc-list"></div>
          </div>
        </section>
      </div>
    </div>

    <script>
      const statusBox = document.getElementById('statusBox');
      const statusGrid = document.getElementById('statusGrid');
      const documentsList = document.getElementById('documentsList');
      const uploadForm = document.getElementById('uploadForm');
      const fileInput = document.getElementById('fileInput');
      const uploadMessage = document.getElementById('uploadMessage');
      const refreshButton = document.getElementById('refreshButton');
      const reloadButton = document.getElementById('reloadButton');
      const fileName = document.getElementById('fileName');

      // El input nativo está oculto por CSS, así que el nombre del archivo hay
      // que escribirlo a mano: sin esto no habría confirmación visual de que la
      // selección funcionó.
      fileInput.addEventListener('change', () => {
        const file = fileInput.files[0];
        fileName.textContent = file ? file.name : 'Elegir archivo';
      });

      // Estados del backend traducidos para la interfaz. `available` es el valor
      // que devuelve la API y se seguía mostrando crudo, en inglés.
      const STATUS_LABEL = {
        available: 'disponible',
        processing: 'procesando',
        error: 'error',
      };

      // Los tres `kind` que ya usaban las llamadas existentes se traducen aquí a
      // las variantes del sistema de diseño, así que los `showMessage(...)` de
      // más abajo no cambian.
      const NOTICE_VARIANT = {
        available: 'success',
        processing: 'accent',
        error: 'danger',
      };

      const showMessage = (message, kind = 'available') => {
        uploadMessage.textContent = message;
        uploadMessage.className = `notice notice-${NOTICE_VARIANT[kind] || 'accent'}`;
        uploadMessage.classList.remove('hidden');
      };

      const formatDate = (value) =>
        new Date(value).toLocaleString('es-CO', {
          day: '2-digit',
          month: 'short',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
        });

      async function loadStatus() {
        try {
          const response = await fetch('/rag/status');
          if (!response.ok) {
            statusGrid.innerHTML = '';
            statusBox.className = 'notice notice-danger';
            statusBox.textContent = `No se pudo cargar el estado del índice (${response.status}). Revisa la terminal del backend.`;
            return;
          }
          const data = await response.json();
          statusGrid.innerHTML = `
            <div class="metric"><span class="metric-value">${data.indexed_chunks}</span><span class="metric-label">Fragmentos indexados</span></div>
            <div class="metric"><span class="metric-value">${data.text_documents}</span><span class="metric-label">Documentos con texto</span></div>
            <div class="metric"><span class="metric-value">${data.scanned_documents}</span><span class="metric-label">Escaneados (sin OCR)</span></div>
          `;
          // El indice ya no se versiona (se reconstruye desde dataset/textos/),
          // asi que en un clon nuevo llega vacio. Sin un aviso explicito el
          // sintoma seria mudo: el agente responde, pero sin ninguna referencia
          // del corpus, y no hay nada en pantalla que explique por que.
          if (!data.indexed_chunks) {
            statusBox.className = 'notice notice-danger';
            statusBox.innerHTML =
              '<strong>El índice está vacío.</strong> El agente responderá sin recuperar ' +
              'conocimiento del corpus. Constrúyelo con:' +
              '<br><code>python backend/scripts/build_knowledge_base.py</code>' +
              '<br><code>python backend/scripts/index_corpus.py</code>';
          } else if (data.dimension_mismatch) {
            statusBox.className = 'notice notice-danger';
            statusBox.innerHTML =
              `<strong>Desfase de dimensiones.</strong> El índice se construyó con ` +
              `${data.actual_index_dimensions} dimensiones y el modelo actual usa ` +
              `${data.embedding_dimensions}. Reindexa el corpus para que vuelvan a coincidir.`;
          } else if (!data.catalog_exists) {
            statusBox.className = 'notice notice-warning';
            statusBox.innerHTML =
              '<strong>Catálogo no encontrado.</strong> Genera el catálogo antes de la llamada.';
          } else {
            statusBox.className = 'notice notice-success';
            statusBox.innerHTML =
              '<strong>Catálogo disponible.</strong> El agente está recuperando conocimiento del corpus indexado.';
          }
        } catch (error) {
          statusGrid.innerHTML = '';
          statusBox.className = 'notice notice-danger';
          statusBox.textContent = `Error de red al cargar el estado: ${error.message}`;
        }
      }

      async function loadDocuments() {
        try {
          const response = await fetch('/admin/documents');
          if (!response.ok) {
            documentsList.innerHTML = `<div class="notice notice-danger">No se pudo cargar la lista (${response.status}).</div>`;
            return;
          }
          const data = await response.json();
          documentsList.innerHTML = '';

          if (!data.documents.length) {
            documentsList.innerHTML = '<div class="conversation-empty">Todavía no hay documentos administrados.</div>';
            return;
          }

          // Ojo: NO nombrar esta variable "document" — sombrea el objeto global
          // `document` del DOM y `document.createElement` deja de existir dentro
          // del bucle, lo que rompía esta función en silencio (sin try/catch no
          // se veía ningún error: la lista simplemente nunca se actualizaba).
          for (const doc of data.documents) {
            const element = document.createElement('article');
            element.className = 'doc-item';
            element.innerHTML = `
              <div class="flex-1">
                <div class="doc-name">${doc.filename}</div>
                <div class="doc-meta">
                  <span>${doc.chunk_count} fragmentos</span>
                  <span>${doc.pages} páginas</span>
                  <span>${doc.category}</span>
                </div>
                <div class="doc-meta" style="margin-top: var(--space-1)">
                  <span>Creado ${formatDate(doc.created_at)}</span>
                  <span>Actualizado ${formatDate(doc.updated_at)}</span>
                </div>
              </div>
              <div class="stack" style="align-items: flex-end; gap: var(--space-2)">
                <span class="badge badge-success"><span class="badge-dot"></span> ${STATUS_LABEL[doc.status] || doc.status}</span>
                <button class="btn btn-danger btn-sm" type="button" data-delete="${doc.document_id}">Eliminar</button>
              </div>
            `;
            documentsList.appendChild(element);
          }

          document.querySelectorAll('[data-delete]').forEach((button) => {
            button.addEventListener('click', async () => {
              const documentId = button.getAttribute('data-delete');
              if (!confirm('¿Eliminar este documento del conocimiento vivo?')) return;
              button.disabled = true;
              button.textContent = 'Eliminando…';
              try {
                const response = await fetch(`/admin/documents/${documentId}`, { method: 'DELETE' });
                const result = await response.json();
                if (!response.ok) {
                  showMessage(result.detail || 'No se pudo eliminar el documento.', 'error');
                  return;
                }
                showMessage(`Documento eliminado: ${result.filename}`, 'processing');
                await loadStatus();
                await loadDocuments();
              } catch (error) {
                showMessage(`Error de red al eliminar: ${error.message}`, 'error');
              }
            });
          });
        } catch (error) {
          documentsList.innerHTML = `<div class="notice notice-danger">Error de red al cargar documentos: ${error.message}</div>`;
        }
      }

      uploadForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const file = fileInput.files[0];
        if (!file) {
          showMessage('Selecciona un archivo primero.', 'error');
          return;
        }

        const submitButton = uploadForm.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        submitButton.textContent = 'Procesando…';
        showMessage('Procesando documento (extracción, chunking e indexado)... puede tardar unos segundos.', 'processing');

        const formData = new FormData();
        formData.append('file', file);

        try {
          const response = await fetch('/admin/documents', { method: 'POST', body: formData });
          const payload = await response.json();

          if (!response.ok) {
            showMessage(payload.detail || 'No se pudo procesar el documento.', 'error');
            return;
          }

          showMessage(`Documento procesado y disponible: ${payload.filename} (${payload.chunk_count} fragmentos)`, 'available');
          fileInput.value = '';
          fileName.textContent = 'Elegir archivo';
          await loadStatus();
          await loadDocuments();
        } catch (error) {
          showMessage(`Error de red al subir el documento: ${error.message}`, 'error');
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = 'Procesar y guardar';
        }
      });

      refreshButton.addEventListener('click', loadDocuments);
      reloadButton.addEventListener('click', async () => {
        await loadStatus();
        await loadDocuments();
      });

      (async () => {
        await loadStatus();
        await loadDocuments();
      })();
    </script>
  </body>
</html>
